name: "Postman Sync & Mock Server Update"

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "app/src/routes/**"
      - "app/src/docs/**"
      - "app/src/dto/**"
      - "app/scripts/sync-postman.mjs"
      - ".github/workflows/postman-sync.yml"
  workflow_dispatch:

jobs:
  sync-postman:
    name: Sync OpenAPI to Postman Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "app/package-lock.json"

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Synchronize Postman Collection and Mock Server
        working-directory: ./app
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_COLLECTION_UID: ${{ secrets.POSTMAN_COLLECTION_UID }}
        run: npm run postman:sync
