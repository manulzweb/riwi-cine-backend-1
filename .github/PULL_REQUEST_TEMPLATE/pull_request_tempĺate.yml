name: Pull Request
description: Backend pull request template
title: ""
labels: []
assignees: []

body:
  - type: textarea
    id: what
    attributes:
      label: What?
      description: Describe the changes introduced in this PR.
      placeholder: |
        Example:
        - Added rate limiting middleware
        - Updated environment configuration
        - Added Prettier configuration
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why?
      description: Explain the reason behind this change.
      placeholder: |
        Example:
        Improve API security and maintain consistent code formatting.
    validations:
      required: true

  - type: textarea
    id: how
    attributes:
      label: How?
      description: Explain how the changes were implemented.
      placeholder: |
        Example:
        - Installed express-rate-limit
        - Added middleware configuration
        - Added environment variables
        - Applied Prettier formatting
    validations:
      required: true

  - type: textarea
    id: testing
    attributes:
      label: Testing
      description: Describe how this change was tested.
      placeholder: |
        Tests performed:
        - Unit tests
        - Integration tests
        - Manual testing

        Steps:
        1.
        2.
        3.
    validations:
      required: true

  - type: checkboxes
    id: breaking_changes
    attributes:
      label: Breaking Changes
      description: Does this change break existing functionality or API contracts?
      options:
        - label: "Yes"
        - label: "No"

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Code follows project conventions.
        - label: I reviewed my own code before requesting review.
        - label: Tests were added or updated if needed.
        - label: Environment variables were documented if added.
        - label: No sensitive information was committed.

  - type: input
    id: related_issues
    attributes:
      label: Related Issues
      description: Optional. Link related GitHub issues.
      placeholder: "Closes #123"
    validations:
      required: false